<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SIX7 V3</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(circle at 50% 0,#172642,#060912 68%);color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;padding:14px 12px 28px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}.stat{font-weight:900}.stat small{display:block;color:#8996ad;font-size:10px;letter-spacing:1.4px}.right{text-align:right}.timer{--p:100%;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(#ffd43b var(--p),#293247 0);box-shadow:0 0 25px #ffd43b33}.timer:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#0a1020}.tin{position:relative;z-index:1;text-align:center}.tin b{font-size:31px;line-height:27px}.tin span{font-size:8px;color:#aab5c8;font-weight:900;letter-spacing:1.4px}.timer.danger{background:conic-gradient(#ff355d var(--p),#401624 0);box-shadow:0 0 30px #ff355d88;animation:pulse .5s infinite}@keyframes pulse{50%{transform:scale(1.08)}}.logo{text-align:center;font-size:39px;font-weight:1000;letter-spacing:-3px;margin-top:8px}.logo i{font-style:normal;color:#ffd43b}.sub{text-align:center;color:#8491a8;font-size:10px;font-weight:900;letter-spacing:1.8px;margin-bottom:10px}.sum{text-align:center;font-size:21px;font-weight:900;margin-bottom:10px}.sum b{color:#ffd43b}.wrap{position:relative}.board{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;touch-action:none;user-select:none}.cell{aspect-ratio:1;border:0;border-radius:13px;color:#fff;font-size:clamp(18px,6vw,28px);font-weight:1000;text-shadow:0 2px 4px #0008;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset 0 1px 0 #fff6,0 5px 11px #0008;transition:.1s}.cell.sel{transform:scale(.86);filter:brightness(1.55);outline:3px solid #fff}.cell.hint{animation:hint .5s 3}@keyframes hint{50%{transform:scale(.86);box-shadow:0 0 25px #fff}}.buttons{display:flex;gap:8px;margin-top:14px}.buttons button{flex:1;border:1px solid #303a50;background:#111827;color:white;border-radius:12px;padding:12px;font-weight:900}.help{text-align:center;color:#8491a8;font-size:11px;margin-top:9px}.overlay{position:absolute;inset:0;z-index:8;background:#030611e8;border-radius:16px;display:none;align-items:center;justify-content:center;overflow:hidden}.stage{text-align:center;width:100%}.boom{font-size:66px;font-weight:1000;color:#ffe04a;text-shadow:0 0 18px #ff9d00,0 0 42px #ff5d00;animation:boom .55s both}@keyframes boom{0%{opacity:0;transform:scale(.15) rotate(-8deg)}70%{transform:scale(1.2)}100%{transform:scale(1)}}.hero{height:205px;display:flex;justify-content:center;align-items:flex-end;position:relative}.aura{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#fff 0 3%,#59b7ff99 18%,#7449ff55 43%,transparent 70%);animation:aura .45s alternate infinite}@keyframes aura{to{transform:scale(1.17);filter:brightness(1.6)}}.char{position:relative;width:145px;height:195px;filter:drop-shadow(0 0 16px #68b8ff)}.hair{position:absolute;left:35px;top:2px;width:76px;height:58px;background:#0c1422;border-radius:55% 55% 40% 40%;box-shadow:-18px 11px 0 -5px #0c1422,18px 8px 0 -5px #0c1422}.face{position:absolute;left:42px;top:38px;width:66px;height:72px;background:linear-gradient(145deg,#ffd0ad,#c8815d);border-radius:45% 45% 50% 50%}.eye{position:absolute;top:29px;width:8px;height:5px;background:#b8f5ff;border-radius:50%;box-shadow:0 0 10px #51cfff}.e1{left:14px}.e2{right:14px}.mouth{position:absolute;left:22px;top:48px;width:23px;height:9px;border-bottom:3px solid #713a31;border-radius:50%}.body{position:absolute;left:23px;top:101px;width:100px;height:90px;border-radius:27px 27px 15px 15px;background:linear-gradient(145deg,#293c59,#080d18);border:1px solid #61708b}.body:after{content:"SIX7";position:absolute;left:25px;top:27px;font-size:20px;font-weight:1000}.arm{position:absolute;top:115px;width:57px;height:20px;border-radius:20px;background:#1b2a42}.al{left:-7px;transform:rotate(-25deg)}.ar{right:-7px;transform:rotate(25deg)}.hand{position:absolute;top:103px;width:30px;height:30px;background:#e5a17b;border-radius:45%}.hl{left:-18px}.hr{right:-18px}.hand:after{position:absolute;top:-23px;left:7px;font-size:27px;font-weight:1000;text-shadow:0 0 10px #5ad6ff}.hl:after{content:"6"}.hr:after{content:"7"}.chainbig{font-size:21px;font-weight:1000}.bonus{font-size:23px;font-weight:1000;color:#6dffae}.p2 .aura{background:radial-gradient(circle,#fff,#bd63ff99 20%,#6e32d655 48%,transparent 72%)}.p3 .aura{background:radial-gradient(circle,#fff,#ffe76d99 20%,#ff8a3555 48%,transparent 72%)}.p4 .aura,.p5 .aura{background:radial-gradient(circle,#fff 0 6%,#ffd43baa 20%,#ff4b2888 48%,transparent 72%);animation-duration:.22s}.end{display:none;text-align:center;padding:34px 15px}.end h2{font-size:42px;margin:0}.final{font-size:50px;font-weight:1000;color:#ffd43b}.restart{border:0;border-radius:14px;padding:14px 25px;background:#ffd43b;color:#111;font-size:17px;font-weight:1000}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="app" id="app"><section id="game"><div class="top"><div class="stat"><small>SCORE</small><span id="score">0</span></div><div class="timer" id="timer"><div class="tin"><b id="time">67</b><br><span>SECONDS</span></div></div><div class="stat right"><small>CHAIN</small><span id="chain">×1</span></div></div><div class="logo">SIX<i>7</i></div><div class="sub">MAKE 67 • BUILD THE CHAIN</div><div class="sum">SOMA: <b id="sum">0</b> / 67</div><div class="wrap"><div class="board" id="board"></div><div class="overlay" id="overlay"><div class="stage" id="stage"><div class="boom">67!</div><div class="hero"><div class="aura"></div><div class="char"><div class="hair"></div><div class="face"><i class="eye e1"></i><i class="eye e2"></i><i class="mouth"></i></div><div class="body"></div><div class="arm al"></div><div class="arm ar"></div><div class="hand hl"></div><div class="hand hr"></div></div></div><div class="chainbig" id="chainbig">CHAIN ×1</div><div class="bonus">+7 SEC</div></div></div></div><div class="buttons"><button id="hint">💡 Dica</button><button id="shuffle">↻ Misturar</button></div><div class="help">Liga números adjacentes sem levantar o dedo. Faz exatamente 67.</div></section><section class="end" id="end"><h2>TIME'S UP</h2><div class="sub">SIX7 RUSH</div><div class="final" id="final">0</div><p>67 conseguidos: <b id="made">0</b><br>Melhor chain: <b id="best">×1</b></p><button class="restart" id="restart">JOGAR OUTRA VEZ</button></section></main>
<script>
(()=>{const R=document.querySelector('#app'),$=x=>R.querySelector('#'+x),B=$('board');const V=[3,5,7,8,9,10,11,12,14,15,17,18,20,21,22,24,25,27,30],C=[['#ff456c','#b81743'],['#ff9f35','#d75a16'],['#f1cf3b','#c29412'],['#31cc8e','#16855f'],['#2aa8e0','#1768af'],['#8066e8','#4931a5']];let a=[],sel=[],score=0,chain=1,best=1,made=0,time=67,run=true,pause=false,tick;const rv=()=>V[Math.floor(Math.random()*V.length)],adj=(x,y)=>{let ax=x%6,ay=Math.floor(x/6),bx=y%6,by=Math.floor(y/6);return Math.abs(ax-bx)+Math.abs(ay-by)===1};
function paint(){B.innerHTML='';a.forEach((o,i)=>{let e=document.createElement('button');e.type='button';e.className='cell';e.textContent=o;let c=C[(o+i)%C.length];e.style.setProperty('--a',c[0]);e.style.setProperty('--b',c[1]);e.dataset.i=i;B.appendChild(e)})}
function reset(){a=Array.from({length:36},rv);sel=[];score=0;chain=1;best=1;made=0;time=67;run=true;pause=false;$('score').textContent=0;$('chain').textContent='×1';$('sum').textContent=0;$('game').style.display='block';$('end').style.display='none';paint();clock()}
function ssum(){return sel.reduce((s,i)=>s+a[i],0)}function mark(){B.querySelectorAll('.cell').forEach((e,i)=>e.classList.toggle('sel',sel.includes(i)));$('sum').textContent=ssum()}
function add(i){if(!run||pause||sel.includes(i))return;if(sel.length&&!adj(sel[sel.length-1],i))return;let n=ssum()+a[i];if(n>67)return;sel.push(i);mark()}
function pos(ev){let el=document.elementFromPoint(ev.clientX,ev.clientY);if(el&&el.classList.contains('cell')&&B.contains(el))add(+el.dataset.i)}
B.addEventListener('pointerdown',e=>{if(!run||pause)return;sel=[];pos(e);B.setPointerCapture?.(e.pointerId)});B.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pos(e)});B.addEventListener('pointerup',finish);B.addEventListener('pointercancel',finish);
function finish(){if(!sel.length)return;if(ssum()===67)win();else{chain=1;$('chain').textContent='×1';sel=[];mark()}}
function win(){pause=true;made++;score+=670*chain;best=Math.max(best,chain);time+=7;$('score').textContent=score;$('chain').textContent='×'+chain;$('chainbig').textContent='CHAIN ×'+chain;let st=$('stage');st.className='stage p'+Math.min(chain,5);$('overlay').style.display='flex';if(navigator.vibrate)navigator.vibrate([50,40,90]);let gone=[...sel];setTimeout(()=>{gone.forEach(i=>a[i]=null);for(let col=0;col<6;col++){let vals=[];for(let row=5;row>=0;row--){let i=row*6+col;if(a[i]!=null)vals.push(a[i])}for(let row=5,k=0;row>=0;row--){let i=row*6+col;a[i]=k<vals.length?vals[k++]:rv()}}paint()},1700);setTimeout(()=>{$('overlay').style.display='none';sel=[];mark();chain++;best=Math.max(best,chain);$('chain').textContent='×'+chain;pause=false},2900)}
function clock(){clearInterval(tick);upd();tick=setInterval(()=>{if(run&&!pause){time--;upd();if(time<=0)over()}},1000)}function upd(){time=Math.max(0,time);$('time').textContent=time;$('timer').style.setProperty('--p',(Math.min(time,67)/67*100)+'%');$('timer').classList.toggle('danger',time<=7)}
function over(){run=false;clearInterval(tick);$('game').style.display='none';$('end').style.display='block';$('final').textContent=score;$('made').textContent=made;$('best').textContent='×'+best}
function path67(){for(let start=0;start<36;start++){let seen=new Set([start]),p=[start];if(dfs(start,a[start],seen,p))return p}return null}function dfs(i,sum,seen,p){if(sum===67)return true;if(sum>67||p.length>8)return false;for(let j=0;j<36;j++)if(!seen.has(j)&&adj(i,j)){seen.add(j);p.push(j);if(dfs(j,sum+a[j],seen,p))return true;p.pop();seen.delete(j)}return false}
$('hint').onclick=()=>{let p=path67();if(!p){a=Array.from({length:36},rv);paint();p=path67()}if(p)p.forEach(i=>B.children[i]?.classList.add('hint'))};$('shuffle').onclick=()=>{if(!pause){a=Array.from({length:36},rv);sel=[];paint();mark()}};$('restart').onclick=reset;reset()})();
</script></body></html>
